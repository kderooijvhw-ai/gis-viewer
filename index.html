<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>VHW Ondergrond Viewer</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

html,body{
height:100%;
margin:0;
font-family:Arial,sans-serif;
}

#sidebar{
position:absolute;
left:0;
top:0;
bottom:0;
width:320px;
background:#fff;
padding:15px;
overflow:auto;
z-index:1000;
box-shadow:0 0 10px rgba(0,0,0,.2);
}

#map{
position:absolute;
left:320px;
right:0;
top:0;
bottom:0;
}

button{
width:100%;
padding:10px;
margin-bottom:5px;
background:#005baa;
color:white;
border:none;
border-radius:4px;
cursor:pointer;
}

input{
width:100%;
margin-bottom:10px;
}

</style>
</head>
<body>

<div id="sidebar">

<h1>🌍 VHW Viewer</h1>

<h3>GeoJSON Upload</h3>
<input type="file" id="geojsonFile" accept=".geojson,.json">

<h3>KML Upload</h3>
<input type="file" id="kmlFile" accept=".kml">

<h3>ZIP Shapefile Upload</h3>
<input type="file" id="shapeFile" accept=".zip">

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://unpkg.com/shpjs@latest/dist/shp.min.js"></script>

<script src="https://unpkg.com/@tmcw/togeojson@5.8.1/dist/togeojson.
<script>

const map = L.map('map').setView([52.1,5.3],8);

L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
maxZoom:19,
attribution:'© OpenStreetMap'
}
).addTo(map);

const uploadLayer = L.geoJSON(null,{
onEachFeature:function(feature,layer){

if(feature.properties){

let html="";

for(const key in feature.properties){

html +=
"<b>"+key+"</b>: "
+
feature.properties[key]
+
"<br>";

}

layer.bindPopup(html);

}

}
}).addTo(map);

function zoomToLayer(){

if(uploadLayer.getBounds().isValid()){

map.fitBounds(
uploadLayer.getBounds()
);

}

}

document
.getElementById('geojsonFile')
.addEventListener('change',function(e){

const file=e.target.files[0];

if(!file) return;

const reader=new FileReader();

reader.onload=function(evt){

const geojson=
JSON.parse(evt.target.result);

uploadLayer.clearLayers();
uploadLayer.addData(geojson);

zoomToLayer();

};

reader.readAsText(file);

});

document
.getElementById('kmlFile')
.addEventListener('change',function(e){

const file=e.target.files[0];

if(!file) return;

const reader=new FileReader();

reader.onload=function(evt){

const parser =
new DOMParser();

const kml =
parser.parseFromString(
evt.target.result,
'text/xml'
);

const geojson =
toGeoJSON.kml(kml);

uploadLayer.clearLayers();
uploadLayer.addData(geojson);

zoomToLayer();

};

reader.readAsText(file);

});

document
.getElementById('shapeFile')
.addEventListener('change',function(e){

const file=e.target.files[0];

if(!file) return;

const reader=new FileReader();

reader.onload=function(evt){

shp(evt.target.result)
.then(function(geojson){

uploadLayer.clearLayers();

uploadLayer.addData(geojson);

zoomToLayer();

});

};

reader.readAsArrayBuffer(file);

});

</script>

</body>
</html>
