<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>VHW Viewer</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
html,body{
    margin:0;
    height:100%;
}

#sidebar{
    position:absolute;
    left:0;
    top:0;
    width:320px;
    height:100%;
    background:#fff;
    padding:15px;
    box-sizing:border-box;
    border-right:1px solid #ddd;
    overflow:auto;
}

#map{
    position:absolute;
    left:320px;
    top:0;
    right:0;
    bottom:0;
}

button{
    width:100%;
    padding:10px;
    margin:5px 0;
    background:#005baa;
    color:white;
    border:none;
    border-radius:4px;
}
</style>
</head>

<body>

<div id="sidebar">

<h1>🌍 VHW Viewer</h1>

<button onclick="zoomNL()">
NL Zoom Nederland
</button>

<p><b>Projectlagen</b></p>
<div id="layers">
Geen lagen geladen
</div>

<p><b>Coördinaten</b></p>
<div id="coords">
-
</div>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView[52.1,5.3],8);

const osm = L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    maxZoom:19,
    attribution:'© OpenStreetMap'
}
);

osm.addTo(map);

function zoomNL(){
    map.setView([52.1,5.3],8);
}

map.on('mousemove', function(e){

document.getElementById('coords').innerHTML =
"Lat: "
+ e.latlng.lat.toFixed(5)
+
"<br>Lon: "
+ e.latlng.lng.toFixed(5);

});

</script>

</body>
</html>
