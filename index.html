<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VHW Ondergrond Viewer</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html,body{
height:100%;
margin:0;
font-family:Arial,sans-serif;
}

#sidebar{
position:absolute;
left:0;
top:0;
bottom:0;
width:300px;
background:white;
z-index:1000;
padding:15px;
box-shadow:2px 0 8px rgba(0,0,0,0.2);
overflow:auto;
}

#map{
position:absolute;
left:300px;
right:0;
top:0;
bottom:0;
}

button{
width:100%;
padding:10px;
margin-top:10px;
}
</style>
</head>

<body>

<div id="sidebar">
<h2>VHW Ondergrond Viewer</h2>

<p><b>Status:</b> Werkende kaart ✅</p>

<button onclick="zoomNL()">
Zoom Nederland
</button>

<hr>

<h3>Roadmap</h3>

<ul>
<li>GeoJSON upload</li>
<li>ZIP Shapefile upload</li>
<li>PDOK luchtfoto</li>
<li>AHN maaiveld</li>
<li>BRO grondwater</li>
<li>Sonderingen</li>
</ul>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([52.2,5.3],8);

const osm = L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'© OpenStreetMap'
}
).addTo(map);

function zoomNL(){
map.setView([52.2,5.3],8);
}

</script>

</body>
</html>
