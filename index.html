<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VHW Ondergrond Viewer</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

html,body{
height:100%;
margin:0;
font-family:Segoe UI,Arial,sans-serif;
}

#sidebar{
position:absolute;
left:0;
top:0;
bottom:0;
width:320px;
background:white;
z-index:1000;
padding:15px;
overflow:auto;
box-shadow:2px 0 8px rgba(0,0,0,0.2);
}

#map{
position:absolute;
left:320px;
right:0;
top:0;
bottom:0;
}

button{
width:100%;
padding:10px;
margin-top:10px;
background:#0078D4;
border:none;
color:white;
border-radius:4px;
cursor:pointer;
}

#dropzone{
margin-top:10px;
padding:15px;
border:2px dashed #999;
border-radius:5px;
text-align:center;
background:#fafafa;
}

.layer-item{
margin-top:5px;
}

</style>

</head>

<body>

<div id="sidebar">

<h2>VHW Ondergrond Viewer</h2>

<input
type="file"
id="upload"
multiple
accept=".geojson,.json">

<button onclick="zoomNL()">
Zoom Nederland
</button>

<div id="dropzone">
Sleep GeoJSON bestanden hierheen
</div>

<h3>Lagen</h3>
<div id="layers">
Geen lagen geladen
</div>

<h3>Coördinaten</h3>
<div id="coords">-</div>

<h3>Objectinformatie</h3>
<div id="featureInfo">
Geen object geselecteerd
</div>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([52.2,5.3],8);

const osm = L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
maxZoom:19,
attribution:'© OpenStreetMap'
}
).addTo(map);

const luchtfoto = L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
{
attribution:'Esri'
}
);

L.control.layers(
{
'OpenStreetMap':osm,
'Luchtfoto':luchtfoto
}
).addTo(map);

let layerCounter=0;
let loadedLayers=[];

function zoomNL(){
map.setView([52.2,5.3],8);
}

function voegLaagToe(naam,data){

const laag=L.geoJSON(data,{

onEachFeature:function(feature,layer){

layer.on('click',function(){

let html='';

if(feature.properties){

for(const key in feature.properties){

html += '<b>' +
key +
'</b>: ' +
feature.properties[key] +
'<br>';

}

}

document.getElementById(
'featureInfo'
).innerHTML =
html || 'Geen attributen';

});

}

}).addTo(map);

loadedLayers.push(laag);

if(layerCounter===0){
document.getElementById(
'layers'
).innerHTML='';
}

const id='laag'+layerCounter;

const div=document.createElement('div');

div.className='layer-item';

div.innerHTML=
'<input type="checkbox" checked id="'+id+'"> '+naam;

document
.getElementById('layers')
.appendChild(div);

document
.getElementById(id)
.addEventListener(
'change',
function(){

if(this.checked){
map.addLayer(laag);
}
else{
map.removeLayer(laag);
}

}
);

if(laag.getBounds().isValid()){
map.fitBounds(laag.getBounds());
}

layerCounter++;

}

async function verwerkBestand(file){

const ext=
file.name
.split('.')
.pop()
.toLowerCase();

if(
ext==='geojson' ||
ext==='json'
){

const txt=
await file.text();

const data=
JSON.parse(txt);

voegLaagToe(
file.name,
data
);

}
else{

alert(
'Momenteel worden alleen GeoJSON bestanden ondersteund.'
);

}

}

document
.getElementById('upload')
.addEventListener(
'change',
async function(e){

for(const file of e.target.files){

await verwerkBestand(file);

}

}
);

const dropzone=
document.getElementById(
'dropzone'
);

dropzone.addEventListener(
'dragover',
function(e){
e.preventDefault();
}
);

dropzone.addEventListener(
'drop',
async function(e){

e.preventDefault();

for(const file of e.dataTransfer.files){

await verwerkBestand(file);

}

}
);

map.on(
'mousemove',
function(e){

document.getElementById(
'coords'
).innerHTML=
'Lat: '+
e.latlng.lat.toFixed(6)+
'<br>Lon: '+
e.latlng.lng.toFixed(6);

}
);

</script>

</body>
</html>
