<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VHW GIS Viewer</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

html,body{
height:100%;
margin:0;
font-family:Segoe UI,Arial,sans-serif;
}

#sidebar{
position:absolute;
left:0;
top:0;
bottom:0;
width:320px;
background:white;
z-index:1000;
overflow:auto;
padding:15px;
box-shadow:2px 0 8px rgba(0,0,0,0.2);
}

#map{
position:absolute;
left:320px;
right:0;
top:0;
bottom:0;
}

button{
width:100%;
padding:10px;
margin-top:8px;
background:#0078D4;
color:white;
border:none;
border-radius:4px;
cursor:pointer;
}

button:hover{
background:#005fa3;
}

.layer-item{
margin-top:5px;
}

#coords{
padding:10px;
background:#f3f3f3;
font-size:12px;
border-radius:4px;
}

#featureInfo{
font-size:12px;
word-break:break-word;
}

</style>

</head>
<body>

<div id="sidebar">

<h1>🌍 VHW Viewer</h1>

<input
type="file"
id="upload"
multiple
accept=".geojson,.json,.zip">

<button onclick="zoomNL()">
NL Zoom Nederland
</button>

<h2>Projectlagen</h2>

<div id="layers">
Geen lagen geladen
</div>

<h2>Coördinaten</h2>

<div id="coords">
-
</div>

<h2>Objectinformatie</h2>

<div id="featureInfo">
Geen object geselecteerd
</div>

</div>

<div id="map"></div>

<!-- Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Shapefile ZIP ondersteuning -->
https://unpkg.com/shpjs@latest/dist/shp.min.jsscript>

<script>

const map = L.map('map').setView([52.2,5.3],8);

const osm = L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
maxZoom:19,
attribution:'© OpenStreetMap'
}
).addTo(map);

const esri = L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
{
maxZoom:19,
attribution:'Esri World Imagery'
}
);

L.control.layers(
{
'OpenStreetMap': osm,
'Satelliet': esri
}
).addTo(map);

let layerCounter = 0;

function zoomNL(){
map.setView([52.2,5.3],8);
}

function voegLaagToe(naam,data){

const laag = L.geoJSON(data,{

onEachFeature:function(feature,layer){

layer.on('click',function(){

let html='';

if(feature.properties){

for(let key in feature.properties){

html +=
'<b>' + key + '</b>: ' +
feature.properties[key] +
'<br>';

}

}

document.getElementById(
'featureInfo'
).innerHTML =
html || 'Geen attributen';

});

}

}).addTo(map);

if(layerCounter===0){
document.getElementById('layers').innerHTML='';
}

const laagId = 'laag_' + layerCounter;

const div = document.createElement('div');

div.className='layer-item';

div.innerHTML =
'<input type="checkbox" checked id="' +
laagId +
'"> ' +
naam;

document
.getElementById('layers')
.appendChild(div);

document
.getElementById(laagId)
.addEventListener(
'change',
function(){

if(this.checked){
map.addLayer(laag);
}else{
map.removeLayer(laag);
}

}
);

if(laag.getBounds().isValid()){
map.fitBounds(laag.getBounds());
}

layerCounter++;

}

async function verwerkBestand(file){

const ext =
file.name
.split('.')
.pop()
.toLowerCase();

try{

if(ext==='geojson' || ext==='json'){

const tekst =
await file.text();

const data =
JSON.parse(tekst);

voegLaagToe(
file.name,
data
);

}

else if(ext==='zip'){

const buffer =
await file.arrayBuffer();

const geojson =
await shp(buffer);

voegLaagToe(
file.name,
geojson
);

}

else{

alert(
'Ondersteund: GeoJSON en ZIP Shapefile'
);

}

}
catch(error){

alert(
'Fout bij laden van bestand: ' +
file.name
);

console.error(error);

}

}

document
.getElementById('upload')
.addEventListener(
'change',
async function(e){

for(const file of e.target.files){

await verwerkBestand(file);

}

}
);

map.on(
'mousemove',
function(e){

document.getElementById(
'coords'
).innerHTML =
'Lat: ' +
e.latlng.lat.toFixed(6) +
'<br>Lon: ' +
e.latlng.lng.toFixed(6);

}
);

</script>

</body>
</html>
