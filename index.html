<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>VHW Ondergrond Viewer</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

html,body{
height:100%;
margin:0;
font-family:Segoe UI, Arial, sans-serif;
}

#sidebar{
position:absolute;
left:0;
top:0;
bottom:0;
width:320px;
background:white;
z-index:1000;
overflow:auto;
padding:15px;
box-shadow:2px 0 8px rgba(0,0,0,0.2);
}

#map{
position:absolute;
left:320px;
right:0;
top:0;
bottom:0;
}

button{
width:100%;
padding:10px;
margin-top:8px;
border:none;
background:#0078D4;
color:white;
border-radius:4px;
cursor:pointer;
}

#layers{
margin-top:15px;
}

.layer-item{
margin-bottom:5px;
}

#dropzone{
border:2px dashed #999;
padding:15px;
text-align:center;
margin-top:10px;
border-radius:5px;
background:#fafafa;
}

</style>
</head>

<body>

<div id="sidebar">

<h2>VHW Ondergrond Viewer</h2>

<input type="file"
id="upload"
multiple
accept=".geojson,.json,.kml">

<button onclick="zoomNL()">
Zoom Nederland
</button>

<div id="dropzone">
Sleep GeoJSON of KML hierheen
</div>

<h3>Lagen</h3>

<div id="layers"></div>

<h3>Coördinaten</h3>

<div id="coords">-</div>

<h3>Objectinformatie</h3>

<div id="featureInfo">
Geen object geselecteerd
</div>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([52.2,5.3],8);

const osm = L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'© OpenStreetMap'
}
).addTo(map);

const esri = L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
{
attribution:'Esri'
}
);

L.control.layers(
{
'OpenStreetMap':osm,
'Luchtfoto':esri
}
).addTo(map);

let counter=0;
const loadedLayers={};

function addLayer(name,geojson){

const layer = L.geoJSON(
geojson,
{
onEachFeature:function(feature,leafletLayer){

leafletLayer.on('click',function(){

let html='';

if(feature.properties){

for(let key in feature.properties){

html +=
'<b>'+key+'</b>: '+
feature.properties[key]+
'<br>';

}

}

document.getElementById(
'featureInfo'
).innerHTML=html;

});

}
}
).addTo(map);

loadedLayers[name]=layer;

const div=document.createElement('div');

div.className='layer-item';

div.innerHTML=
'<input type="checkbox" checked id="l'+counter+'"> '+
name;

document
.getElementById('layers')
.appendChild(div);

document
.getElementById('l'+counter)
.addEventListener('change',function(){

if(this.checked)
map.addLayer(layer);
else
map.removeLayer(layer);

});

counter++;

if(layer.getBounds().isValid()){
map.fitBounds(layer.getBounds());
}

}

async function processFile(file){

const ext =
file.name
.split('.')
.pop()
.toLowerCase();

if(ext==='geojson' || ext==='json'){

const data =
JSON.parse(
await file.text()
);

addLayer(
file.name,
data
);

}

else if(ext==='kml'){

alert(
'KML ondersteuning komt in de volgende versie'
);

}

}

document
.getElementById('upload')
.addEventListener(
'change',
async function(e){

for(const file of e.target.files){

await processFile(file);

}

}
);

const dropzone =
document.getElementById(
'dropzone'
);

dropzone.addEventListener(
'dragover',
e=>e.preventDefault()
);

dropzone.addEventListener(
'drop',
async function(e){

e.preventDefault();

for(const file of e.dataTransfer.files){

await processFile(file);

}

}
);

map.on(
'mousemove',
function(e){

document.getElementById(
'coords'
).innerHTML=
'Lat: '+
e.latlng.lat.toFixed(6)+
'<br>Lon: '+
e.latlng.lng.toFixed(6);

}
);

function zoomNL(){

map.setView(
[52.2,5.3],
8
);

}

</script>

</body>
</html>
