<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VHW Ondergrond Viewer</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

html,body{
margin:0;
padding:0;
height:100%;
font-family:Arial,sans-serif;
}

#sidebar{
position:absolute;
left:0;
top:0;
width:320px;
height:100%;
background:white;
padding:15px;
box-sizing:border-box;
overflow:auto;
z-index:1000;
box-shadow:2px 0 10px rgba(0,0,0,0.2);
}

#map{
position:absolute;
top:0;
left:320px;
right:0;
bottom:0;
}

h1{
margin-top:0;
color:#005baa;
}

h3{
margin-bottom:10px;
}

button{
width:100%;
padding:10px;
margin-bottom:5px;
border:none;
border-radius:4px;
background:#005baa;
color:white;
cursor:pointer;
}

button:hover{
background:#004080;
}

input[type=file]{
width:100%;
margin-bottom:10px;
}

.info-box{
background:#f5f5f5;
padding:10px;
border-radius:4px;
font-size:13px;
margin-top:10px;
}

label{
display:block;
margin-bottom:6px;
}

</style>

</head>
<body>

<div id="sidebar">

<h1>🌍 VHW Viewer</h1>

<p>
Ondergrond • Kabels • Leidingen
</p>

<button onclick="zoomNederland()">
🇳🇱 Zoom Nederland
</button>

<hr>

<h3>📂 Upload GeoData</h3>

<input type="file"
id="geojsonFile"
accept=".geojson,.json">

<input type="file"
id="kmlFile"
accept=".kml">

<hr>

<h3>🗺 Basiskaart</h3>

<label>
<input type="radio"
name="basemap"
checked
onclick="showOSM()">
OpenStreetMap
</label>

<label>
<input type="radio"
name="basemap"
onclick="showSatellite()">
Satelliet
</label>

<hr>

<h3>📍 Coördinaten</h3>

<div id="coords" class="info-box">
Beweeg over de kaart
</div>

<hr>

<h3>📋 Objectinformatie</h3>

<div id="objectInfo" class="info-box">
Geen object geselecteerd
</div>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/script>

<script>

const map = L.map('map').setView([52.1,5.3],8);

const osm = L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
maxZoom:19,
attribution:'© OpenStreetMap'
}
);

const satellite = L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
{
maxZoom:19,
attribution:'© Esri'
}
);

osm.addTo(map);

const uploadLayer = L.geoJSON(null,{
onEachFeature:function(feature,layer){

layer.on('click',function(){

document.getElementById("objectInfo")
.innerHTML =
JSON.stringify(
feature.properties,
null,
2
);

});

}
}).addTo(map);

function showOSM(){

if(map.hasLayer(satellite)){
map.removeLayer(satellite);
}

osm.addTo(map);

}

function showSatellite(){

if(map.hasLayer(osm)){
map.removeLayer(osm);
}

satellite.addTo(map);

}

function zoomNederland(){

map.setView([52.1,5.3],8);

}

map.on('mousemove',function(e){

document.getElementById('coords').innerHTML =

'Lat: '
+ e.latlng.lat.toFixed(5)

+

'<br>Lon: '

+ e.latlng.lng.toFixed(5);

});

document
.getElementById('geojsonFile')
.addEventListener('change',function(e){

const file=e.target.files[0];

if(!file) return;

const reader=new FileReader();

reader.onload=function(evt){

const geojson=

JSON.parse(evt.target.result);

uploadLayer.clearLayers();

uploadLayer.addData(geojson);

if(uploadLayer.getBounds().isValid()){

map.fitBounds(
uploadLayer.getBounds()
);

}

};

reader.readAsText(file);

});

</script>

</body>
</html>
