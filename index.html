<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>VHW GIS Viewer</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

html,body{
height:100%;
margin:0;
font-family:Arial,sans-serif;
}

#sidebar{
position:absolute;
left:0;
top:0;
bottom:0;
width:320px;
background:white;
z-index:1000;
overflow:auto;
padding:15px;
box-shadow:2px 0 8px rgba(0,0,0,0.2);
}

#map{
position:absolute;
left:320px;
right:0;
top:0;
bottom:0;
}

button{
width:100%;
padding:10px;
margin-top:8px;
background:#0078d4;
color:white;
border:none;
border-radius:4px;
cursor:pointer;
}

.layer-item{
margin-top:5px;
}

#coords{
padding:10px;
background:#f2f2f2;
font-size:12px;
}

</style>
</head>

<body>

<div id="sidebar">

<h2>🌍 VHW Viewer</h2>

<input
type="file"
id="upload"
multiple
accept=".geojson,.json,.zip">

<button onclick="zoomNL()">
NL Zoom Nederland
</button>

<h3>Projectlagen</h3>

<div id="layers">
Geen lagen geladen
</div>

<h3>Coördinaten</h3>

<div id="coords">
-
</div>

<h3>Objectinformatie</h3>

<div id="featureInfo">
Geen object geselecteerd
</div>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/shpjs@latest.jsscript>

<script>

const map=L.map('map').setView([52.2,5.3],8);

const osm=L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'© OpenStreetMap'
}
).addTo(map);

const esri=L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
{
attribution:'Esri'
}
);

L.control.layers(
{
"OpenStreetMap":osm,
"Satelliet":esri
}
).addTo(map);

let counter=0;

function zoomNL(){
map.setView([52.2,5.3],8);
}

function addLayer(name,data){

const layer=L.geoJSON(data,{

onEachFeature:function(feature,l){

l.on('click',function(){

let html='';

if(feature.properties){

for(let key in feature.properties){

html +=
'<b>'+key+'</b>: '+
feature.properties[key]+
'<br>';

}

}

document.getElementById(
'featureInfo'
).innerHTML=
html || 'Geen attributen';

});

}

}).addTo(map);

if(counter===0){
document.getElementById('layers').innerHTML='';
}

const id='layer_'+counter;

const div=document.createElement('div');

div.className='layer-item';

div.innerHTML=
'<input type="checkbox" checked id="'+id+'"> '+
name;

document.getElementById('layers')
.appendChild(div);

document.getElementById(id)
.addEventListener('change',function(){

if(this.checked){
map.addLayer(layer);
}
else{
map.removeLayer(layer);
}

});

if(layer.getBounds().isValid()){
map.fitBounds(layer.getBounds());
}

counter++;

}

async function processFile(file){

const ext=file.name
.split('.')
.pop()
.toLowerCase();

if(ext==='geojson' || ext==='json'){

const txt=
await file.text();

addLayer(
file.name,
JSON.parse(txt)
);

}

else if(ext==='zip'){

const buffer=
await file.arrayBuffer();

const geojson=
await shp(buffer);

addLayer(
file.name,
geojson
);

}

else{

alert(
'Ondersteund: GeoJSON en ZIP Shapefile'
);

}

}

document.getElementById('upload')
.addEventListener(
'change',
async function(e){

for(const file of e.target.files){

await processFile(file);

}

}
);

map.on(
'mousemove',
function(e){

document.getElementById(
'coords'
).innerHTML=

'Lat: '+
e.latlng.lat.toFixed(6)+

'<br>Lon: '+
e.latlng.lng.toFixed(6);

}
);

</script>

</body>
</html>
