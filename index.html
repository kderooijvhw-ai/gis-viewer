<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>VHW GIS Viewer</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

html,body{
margin:0;
height:100%;
font-family:Arial,sans-serif;
}

#sidebar{
position:absolute;
left:0;
top:0;
bottom:0;
width:320px;
padding:15px;
background:white;
box-sizing:border-box;
overflow:auto;
border-right:1px solid #ddd;
z-index:1000;
}

#map{
position:absolute;
left:320px;
right:0;
top:0;
bottom:0;
}

h1{
color:#005baa;
}

input{
width:100%;
margin-bottom:10px;
}

.info{
background:#f5f5f5;
padding:10px;
border-radius:4px;
margin-top:10px;
}

</style>
</head>
<body>

<div id="sidebar">

<h1>🌍 VHW Viewer</h1>

<h3>GeoJSON</h3>
<input type="file" id="geojsonFile"
accept=".geojson,.json">

<h3>KML</h3>
<input type="file" id="kmlFile"
accept=".kml">

<h3>ZIP Shapefile</h3>
<input type="file" id="shapeFile"
accept=".zip">

<div class="info">
GIS Viewer voor projectdata
</div>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/shpjs@latest/dist/shp.min.js"></script>
<script src="https://unpkg.com/@tmcw/togeojson@5.8.1/dist/togcript>

<script>

const map = L.map('map').setView([52.1,5.3],8);

L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
maxZoom:19,
attribution:'© OpenStreetMap'
}
).addTo(map);

const uploadLayer =
L.geoJSON().addTo(map);

function zoomToLayer(){

if(uploadLayer.getBounds().isValid()){

map.fitBounds(
uploadLayer.getBounds()
);

}

}

/* GEOJSON */

document
.getElementById("geojsonFile")
.addEventListener("change",function(e){

const file=e.target.files[0];

if(!file) return;

const reader=new FileReader();

reader.onload=function(evt){

const geojson=
JSON.parse(evt.target.result);

uploadLayer.clearLayers();

uploadLayer.addData(geojson);

zoomToLayer();

};

reader.readAsText(file);

});

/* KML */

document
.getElementById("kmlFile")
.addEventListener("change",function(e){

const file=e.target.files[0];

if(!file) return;

const reader=new FileReader();

reader.onload=function(evt){

const parser =
new DOMParser();

const kml =
parser.parseFromString(
evt.target.result,
"text/xml"
);

const geojson =
toGeoJSON.kml(kml);

uploadLayer.clearLayers();

uploadLayer.addData(
geojson
);

zoomToLayer();

};

reader.readAsText(file);

});

/* SHAPEFILE ZIP */

document
.getElementById("shapeFile")
.addEventListener("change",function(e){

const file=e.target.files[0];

if(!file) return;

const reader =
new FileReader();

reader.onload=function(evt){

shp(evt.target.result)

.then(function(geojson){

uploadLayer.clearLayers();

uploadLayer.addData(
geojson
);

zoomToLayer();

});

};

reader.readAsArrayBuffer(file);

});

</script>

</body>
</html>
