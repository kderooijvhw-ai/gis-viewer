https://unpkg.com/leaflet@1.9.4/dist/leaflet.jsscript>

<script>

var map = L.map('map').setView([52.1,5.3],8);

var brt = L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
maxZoom:19
}
);

var luchtfoto = L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
{
maxZoom:19
}
);

brt.addTo(map);

var projectLayer = L.geoJSON().addTo(map);

function showBRT(){
    map.removeLayer(luchtfoto);
    brt.addTo(map);
}

function showLuchtfoto(){
    map.removeLayer(brt);
    luchtfoto.addTo(map);
}

document
.getElementById('geojsonFile')
.addEventListener('change',function(e){

var file=e.target.files[0];

if(!file) return;

var reader=new FileReader();

reader.onload=function(event){

var geojson=
JSON.parse(event.target.result);

projectLayer.clearLayers();

projectLayer.addData(geojson);

map.fitBounds(
projectLayer.getBounds()
);

};

reader.readAsText(file);

});

map.on('mousemove',function(e){

document
.getElementById('coords')
.innerHTML=

'Lat: '
+ e.latlng.lat.toFixed(5)

+

'<br>Lon: '

+ e.latlng.lng.toFixed(5);

});

</script>

<body>

<div class="header">
    <h1>VHW Ondergrond Viewer</h1>

    <p>
        <strong>Status:</strong> Online ✅
    </p>

    <h3>Basiskaarten</h3>

    <button onclick="showBRT()">
        BRT Kaart
    </button>

    <button onclick="showLuchtfoto()">
        Luchtfoto
    </button>

    <hr>

    <h3>Projectdata</h3>

    <input
        type="file"
        id="geojsonFile"
        accept=".geojson,.json"
    >

    <hr>

    <h3>Tools</h3>

    <button onclick="map.setView([51.6978,5.3037],13)">
        Naar Den Bosch
    </button>

    <button onclick="map.zoomIn()">
        Inzoomen
    </button>

    <button onclick="map.zoomOut()">
        Uitzoomen
    </button>

    <hr>

    <small>
        VHW Engineering GIS Viewer v1
    </small>
</div>

<div id="map"></div>

<div id="coords"
style="
position:absolute;
bottom:10px;
right:10px;
background:white;
padding:6px;
z-index:1000;
border-radius:6px;
font-family:Arial;
">
Lat: -
Lon: -
</div>
  
</body>
</html>
